<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161a">
<title>交通費精算</title>
<style>
  :root{
    --ground:#14161a;
    --panel:#1c1f25;
    --line:#2b3038;
    --text:#e8e6e1;
    --muted:#868c96;
    --seal:#e2483d;
    --sat:#6ea8e8;
    --sun:#e08a86;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 48px}

  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  header h1{font-size:17px;font-weight:600;letter-spacing:.08em;margin:0}

  .month{display:flex;align-items:center;gap:2px}
  .month b{font-family:var(--mono);font-size:15px;font-weight:600;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
  .nav{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:8px 10px;cursor:pointer;font-family:var(--mono)}
  .nav:active{color:var(--text)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}

  .fare-row{display:flex;align-items:center;gap:10px}
  .fare-row label{flex:1;font-size:14px;color:var(--muted)}
  input[type=number]{
    width:130px;background:#0e1013;border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:var(--mono);font-size:22px;font-weight:600;
    text-align:right;padding:10px 12px;font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus{outline:none;border-color:var(--seal)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .yen{font-size:13px;color:var(--muted);width:14px}

  .check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--muted);cursor:pointer}
  .check input{width:19px;height:19px;accent-color:var(--seal);margin:0}

  .cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-head{margin-bottom:6px}
  .cal-head span{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--muted)}
  .cal-head span.s6{color:var(--sat)} .cal-head span.s0{color:var(--sun)}
  .cell{
    position:relative;aspect-ratio:1/1;border:0;background:none;padding:0;
    font-family:var(--mono);font-size:15px;color:var(--text);
    border-radius:50%;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:transform .08s ease;
  }
  .cell.s6{color:var(--sat)} .cell.s0{color:var(--sun)}
  .cell.blank{visibility:hidden}
  .cell.on{color:var(--seal);font-weight:700;box-shadow:inset 0 0 0 2px var(--seal);background:rgba(226,72,61,.12)}
  .cell.today::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--muted)}
  .cell.on:active{transform:scale(.9)}

  .cal-tools{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1;background:none;border:1px solid var(--line);border-radius:9px;
    color:var(--muted);font-family:var(--sans);font-size:13px;padding:10px;cursor:pointer;
  }
  .btn:active{border-color:var(--seal);color:var(--text)}

  .total-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px}
  .total-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .total-num{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .total-num small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
  .breakdown{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .copy{
    background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);
    font-family:var(--sans);font-size:12px;padding:7px 12px;cursor:pointer;white-space:nowrap;
  }
  .copy:active,.copy.done{border-color:var(--seal);color:var(--seal)}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .fmt{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .fmt button{flex:1;background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;padding:8px 3px;cursor:pointer;white-space:nowrap}
  .fmt button:last-child{border-right:0}
  .fmt button.on{background:var(--seal);color:#fff}
  .days{font-family:var(--mono);font-size:14px;line-height:1.8;word-break:break-all;white-space:pre-line;min-height:1.8em;font-variant-numeric:tabular-nums}
  .days.empty{color:var(--muted)}
  .list-foot{display:flex;justify-content:flex-end;margin-top:12px}

  /* ---------- 写真ZIP ---------- */
  .ph-card [hidden]{display:none!important}
  .ph-file{display:none}
  .ph-actions{display:flex;gap:8px;margin-top:12px}
  .ph-add,.ph-sub{
    flex:1;display:block;text-align:center;background:none;border:1px solid var(--line);border-radius:9px;
    color:var(--muted);font-family:var(--sans);font-size:13px;padding:10px;cursor:pointer;text-decoration:none;
  }
  .ph-add{color:var(--text)}
  .ph-add:active,.ph-sub:active{border-color:var(--seal);color:var(--text)}
  .ph-sub:disabled{opacity:.35;cursor:default}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .ph-grid:empty{display:none}
  .ph-item{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#0e1013}
  .ph-item img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-no{position:absolute;left:4px;bottom:4px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:0 4px}
  .ph-del{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
  .ph-status{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ph-status.err{color:var(--seal)}
  .ph-primary{
    flex:1;background:var(--seal);border:1px solid var(--seal);color:#fff;border-radius:9px;
    font-family:var(--sans);font-size:14px;font-weight:600;padding:12px;cursor:pointer;
  }
  .ph-primary:disabled{opacity:.35;cursor:default}
  .ph-note{margin:12px 0 0;font-size:11px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>交通費精算</h1>
    <div class="month">
      <button class="nav" id="prev" aria-label="前の月">‹</button>
      <b id="ym">----年--月</b>
      <button class="nav" id="next" aria-label="次の月">›</button>
    </div>
  </header>

  <div class="card">
    <div class="fare-row">
      <label for="fare" id="fareLabel">片道運賃</label>
      <input type="number" id="fare" inputmode="numeric" pattern="[0-9]*" min="0" step="10" value="0">
      <span class="yen">円</span>
    </div>
    <label class="check"><input type="checkbox" id="manual">往復運賃を直接入力する</label>
  </div>

  <div class="card">
    <div class="cal-head">
      <span class="s0">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="s6">土</span>
    </div>
    <div class="cal" id="cal"></div>
    <div class="cal-tools">
      <button class="btn" id="weekdays">平日を全選択</button>
      <button class="btn" id="clear">クリア</button>
    </div>
  </div>

  <div class="total-card">
    <div class="eyebrow">合計交通費</div>
    <div class="total-top">
      <div class="total-num" id="total">0<small>円</small></div>
      <button class="copy" id="copyTotal">金額をコピー</button>
    </div>
    <div class="breakdown" id="breakdown">出社日を選んでください</div>
  </div>

  <div class="card">
    <div class="list-head">
      <div class="eyebrow">出社日 <span id="count" style="color:var(--text);letter-spacing:0">0日</span></div>
    </div>
    <div class="fmt" id="fmt">
      <button data-f="3" class="on">申請文</button>
      <button data-f="0">1、2</button>
      <button data-f="1">7/1、7/2</button>
      <button data-f="2">1日、2日</button>
    </div>
    <div class="days empty" id="days">未選択</div>
    <div class="list-foot"><button class="copy" id="copyDays">テキストをコピー</button></div>
  </div>

  <div class="card ph-card">
    <div class="list-head">
      <div class="eyebrow">写真をZIPにまとめる <span id="phCount" style="color:var(--text);letter-spacing:0">0枚</span></div>
    </div>
    <div class="ph-actions">
      <label class="ph-add" for="phInput">写真を追加</label>
      <button class="ph-sub" id="phClear" disabled>すべて外す</button>
    </div>
    <input type="file" id="phInput" class="ph-file" accept="image/*" multiple>
    <div class="ph-grid" id="phGrid"></div>
    <div class="ph-status" id="phStatus">写真を選んでください</div>
    <div class="ph-actions">
      <button class="ph-primary" id="phMake" disabled>ZIPを作成</button>
    </div>
    <div class="ph-actions" id="phDlRow" hidden>
      <a class="ph-sub" id="phDl" href="#" download>共有できない場合はこちらからダウンロード</a>
    </div>
    <p class="ph-note">写真はこの端末の中だけで処理され、外部に送信されません。</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 保存領域(Claudeアプリ / Safari単体 / どちらでも動く) ---------- */
  var KEY = "koutsuhi-data";
  var hasWS = (typeof window.storage === "object" && window.storage && typeof window.storage.get === "function");
  var memFallback = null;

  function loadData(cb){
    if (hasWS){
      window.storage.get(KEY).then(function(r){
        cb(r && r.value ? safeParse(r.value) : null);
      }).catch(function(){ cb(null); });
      return;
    }
    var v = null;
    try { v = window.localStorage.getItem(KEY); } catch(e){ v = null; }
    cb(v ? safeParse(v) : memFallback);
  }
  var saveTimer = null;
  function saveData(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var json = JSON.stringify(state);
      memFallback = safeParse(json);
      if (hasWS){ try { window.storage.set(KEY, json).catch(function(){}); } catch(e){} return; }
      try { window.localStorage.setItem(KEY, json); } catch(e){}
    }, 250);
  }
  function safeParse(s){ try { return JSON.parse(s); } catch(e){ return null; } }

  /* ---------- 状態 ---------- */
  var now = new Date();
  var state = {
    fare: 0,
    manual: false,
    fmt: 3,
    months: {}   // "2026-07": [1,5,8]
  };
  var view = { y: now.getFullYear(), m: now.getMonth() + 1 };

  function key(y,m){ return y + "-" + (m<10?"0":"") + m; }
  function selected(){
    var k = key(view.y, view.m);
    if (!Array.isArray(state.months[k])) state.months[k] = [];
    return state.months[k];
  }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function firstWeekday(y,m){ return new Date(y, m-1, 1).getDay(); }

  /* ---------- 描画 ---------- */
  var el = {};
  ["prev","next","ym","fare","fareLabel","manual","cal","weekdays","clear",
   "total","breakdown","copyTotal","count","fmt","days","copyDays"]
   .forEach(function(id){ el[id] = document.getElementById(id); });

  function renderCalendar(){
    el.ym.textContent = view.y + "年" + view.m + "月";
    var total = daysInMonth(view.y, view.m);
    var lead = firstWeekday(view.y, view.m);
    var sel = selected();
    var html = "";
    for (var i=0;i<lead;i++) html += '<button class="cell blank" disabled></button>';
    for (var d=1; d<=total; d++){
      var w = (lead + d - 1) % 7;
      var cls = "cell s" + w;
      if (sel.indexOf(d) !== -1) cls += " on";
      if (view.y===now.getFullYear() && view.m===now.getMonth()+1 && d===now.getDate()) cls += " today";
      html += '<button class="'+cls+'" data-d="'+d+'" aria-pressed="'+(sel.indexOf(d)!==-1)+'">'+d+'</button>';
    }
    el.cal.innerHTML = html;
  }

  function buildOutput(list, fmt){
    if (!list.length) return "";
    if (fmt === 3){
      return view.m + "/" + list.join(",") + "\nをまとめて申請致します。";
    }
    return list.map(function(d){
      if (fmt === 1) return view.m + "/" + d;
      if (fmt === 2) return d + "日";
      return String(d);
    }).join("、");
  }

  function renderTotals(){
    var sel = selected().slice().sort(function(a,b){ return a-b; });
    var fare = Math.max(0, Math.floor(Number(el.fare.value) || 0));
    var round = state.manual ? fare : fare * 2;
    var sum = round * sel.length;

    el.total.innerHTML = sum.toLocaleString("ja-JP") + "<small>円</small>";
    el.count.textContent = sel.length + "日";

    if (!sel.length){
      el.breakdown.textContent = "出社日を選んでください";
    } else if (state.manual){
      el.breakdown.textContent = "往復 " + round.toLocaleString("ja-JP") + "円 × " + sel.length + "日";
    } else {
      el.breakdown.textContent = "片道 " + fare.toLocaleString("ja-JP") + "円 × 2 × " + sel.length + "日";
    }

    var txt = buildOutput(sel, state.fmt);
    el.days.textContent = txt || "未選択";
    el.days.className = txt ? "days" : "days empty";
  }

  function renderAll(){ renderCalendar(); renderTotals(); }

  /* ---------- 操作 ---------- */
  el.cal.addEventListener("click", function(e){
    var btn = e.target.closest("button.cell");
    if (!btn || btn.disabled) return;
    var d = Number(btn.dataset.d);
    var sel = selected();
    var i = sel.indexOf(d);
    if (i === -1) sel.push(d); else sel.splice(i, 1);
    sel.sort(function(a,b){ return a-b; });
    btn.classList.toggle("on");
    btn.setAttribute("aria-pressed", sel.indexOf(d) !== -1);
    renderTotals(); saveData();
  });

  el.prev.addEventListener("click", function(){
    view.m--; if (view.m < 1){ view.m = 12; view.y--; } renderAll();
  });
  el.next.addEventListener("click", function(){
    view.m++; if (view.m > 12){ view.m = 1; view.y++; } renderAll();
  });

  el.weekdays.addEventListener("click", function(){
    var total = daysInMonth(view.y, view.m), sel = [];
    for (var d=1; d<=total; d++){
      var w = new Date(view.y, view.m-1, d).getDay();
      if (w !== 0 && w !== 6) sel.push(d);
    }
    state.months[key(view.y, view.m)] = sel;
    renderAll(); saveData();
  });

  el.clear.addEventListener("click", function(){
    state.months[key(view.y, view.m)] = [];
    renderAll(); saveData();
  });

  el.fare.addEventListener("input", function(){
    state.fare = Math.max(0, Math.floor(Number(el.fare.value) || 0));
    renderTotals(); saveData();
  });

  el.manual.addEventListener("change", function(){
    state.manual = el.manual.checked;
    el.fareLabel.textContent = state.manual ? "往復運賃" : "片道運賃";
    renderTotals(); saveData();
  });

  el.fmt.addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]");
    if (!b) return;
    state.fmt = Number(b.dataset.f);
    Array.prototype.forEach.call(el.fmt.children, function(c){
      c.classList.toggle("on", c === b);
    });
    renderTotals(); saveData();
  });

  /* ---------- コピー(iOS Safari のフォールバック込み) ---------- */
  function copyText(text, btn, label){
    if (!text) return;
    function done(){
      var old = btn.textContent;
      btn.textContent = "コピーしました";
      btn.classList.add("done");
      setTimeout(function(){ btn.textContent = label || old; btn.classList.remove("done"); }, 1200);
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(function(){ legacy(text, done); });
    } else {
      legacy(text, done);
    }
  }
  function legacy(text, done){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  el.copyTotal.addEventListener("click", function(){
    var sel = selected();
    var fare = Math.max(0, Math.floor(Number(el.fare.value) || 0));
    var round = state.manual ? fare : fare * 2;
    copyText(String(round * sel.length), el.copyTotal, "金額をコピー");
  });
  el.copyDays.addEventListener("click", function(){
    var sel = selected().slice().sort(function(a,b){ return a-b; });
    copyText(buildOutput(sel, state.fmt), el.copyDays, "テキストをコピー");
  });

  /* ---------- 起動 ---------- */
  loadData(function(saved){
    if (saved && typeof saved === "object"){
      state.fare   = Number(saved.fare) || 0;
      state.manual = !!saved.manual;
      state.fmt    = [0,1,2,3].indexOf(Number(saved.fmt)) !== -1 ? Number(saved.fmt) : 3;
      state.months = (saved.months && typeof saved.months === "object") ? saved.months : {};
    }
    el.fare.value = state.fare || "";
    el.manual.checked = state.manual;
    el.fareLabel.textContent = state.manual ? "往復運賃" : "片道運賃";
    Array.prototype.forEach.call(el.fmt.children, function(c){
      c.classList.toggle("on", Number(c.dataset.f) === state.fmt);
    });
    renderAll();
  });
})();
</script>

<script>
/* ============ 写真ZIP(交通費計算とは独立して動作) ============ */
(function(){
  "use strict";

  /*ZIP-BEGIN*/
  var CRC_TABLE = (function(){
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8){
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function readBytes(blob){
    if (typeof blob.arrayBuffer === "function") return blob.arrayBuffer();
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){ resolve(fr.result); };
      fr.onerror = function(){ reject(fr.error); };
      fr.readAsArrayBuffer(blob);
    });
  }

  function dosDateTime(d){
    if (!(d instanceof Date) || isNaN(d) || d.getFullYear() < 1980) d = new Date(1980, 0, 1);
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
    };
  }

  /* 無圧縮(STORE)のZIPを作る。写真は元々圧縮済みなので無圧縮で十分速く、サイズもほぼ変わらない */
  async function buildZip(entries, onProgress){
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0, cdSize = 0;
    if (entries.length > 65535) throw new Error("枚数が多すぎます(65535枚まで)");

    for (var i = 0; i < entries.length; i++){
      var e = entries[i];
      var bytes = new Uint8Array(await readBytes(e.blob));
      var crc = crc32(bytes), size = bytes.length;
      bytes = null;
      var name = enc.encode(e.name);
      var dt = dosDateTime(e.date);

      if (offset + 30 + name.length + size > 0xFFFFFFFF) throw new Error("合計4GBを超えるため作成できません");

      var lh = new Uint8Array(30 + name.length), v = new DataView(lh.buffer);
      v.setUint32(0, 0x04034b50, true);
      v.setUint16(4, 20, true);
      v.setUint16(6, 0x0800, true);      // ファイル名はUTF-8
      v.setUint16(8, 0, true);           // STORE
      v.setUint16(10, dt.time, true);
      v.setUint16(12, dt.date, true);
      v.setUint32(14, crc, true);
      v.setUint32(18, size, true);
      v.setUint32(22, size, true);
      v.setUint16(26, name.length, true);
      v.setUint16(28, 0, true);
      lh.set(name, 30);

      var ch = new Uint8Array(46 + name.length), w = new DataView(ch.buffer);
      w.setUint32(0, 0x02014b50, true);
      w.setUint16(4, 20, true);
      w.setUint16(6, 20, true);
      w.setUint16(8, 0x0800, true);
      w.setUint16(10, 0, true);
      w.setUint16(12, dt.time, true);
      w.setUint16(14, dt.date, true);
      w.setUint32(16, crc, true);
      w.setUint32(20, size, true);
      w.setUint32(24, size, true);
      w.setUint16(28, name.length, true);
      w.setUint16(30, 0, true);
      w.setUint16(32, 0, true);
      w.setUint16(34, 0, true);
      w.setUint16(36, 0, true);
      w.setUint32(38, 0, true);
      w.setUint32(42, offset, true);
      ch.set(name, 46);

      parts.push(lh, e.blob);            // 中身は元のFileを参照(メモリに全写真を抱えない)
      central.push(ch);
      offset += lh.length + size;
      cdSize += ch.length;
      if (onProgress) onProgress(i + 1, entries.length);
    }

    var eocd = new Uint8Array(22), x = new DataView(eocd.buffer);
    x.setUint32(0, 0x06054b50, true);
    x.setUint16(8, entries.length, true);
    x.setUint16(10, entries.length, true);
    x.setUint32(12, cdSize, true);
    x.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eocd]), { type: "application/zip" });
  }

  var EXT = { "image/jpeg":".jpg", "image/png":".png", "image/heic":".heic", "image/heif":".heif",
              "image/gif":".gif", "image/webp":".webp" };

  function entryName(file, index, total){
    var width = Math.max(2, String(total).length);
    var no = String(index + 1);
    while (no.length < width) no = "0" + no;
    var base = String(file.name || "").replace(/[\\\/:*?"<>|\x00-\x1f]/g, "_").trim();
    if (!base) base = "photo";
    if (!/\.[A-Za-z0-9]{2,5}$/.test(base)) base += (EXT[file.type] || ".jpg");
    return no + "_" + base;
  }
  /*ZIP-END*/

  if (typeof document === "undefined" || !document.getElementById("phInput")) return;

  /* ---------- 画面 ---------- */
  function $(id){ return document.getElementById(id); }
  var input = $("phInput"), grid = $("phGrid"), count = $("phCount"), status = $("phStatus"),
      make = $("phMake"), clearBtn = $("phClear"), dlRow = $("phDlRow"), dl = $("phDl");

  var items = [];      // { file, url }
  var built = null;    // 完成したZIP(File)
  var dlUrl = null;
  var busy = false;

  function fmtSize(n){
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    return Math.max(1, Math.round(n / 1024)) + " KB";
  }

  function monthTag(){
    var m = /(\d{4})年(\d{1,2})月/.exec(($("ym") && $("ym").textContent) || "");
    var d = new Date();
    var y = m ? Number(m[1]) : d.getFullYear();
    var mo = m ? Number(m[2]) : d.getMonth() + 1;
    return y + "-" + (mo < 10 ? "0" : "") + mo;
  }

  function invalidate(){
    built = null;
    if (dlUrl){ URL.revokeObjectURL(dlUrl); dlUrl = null; }
    dl.setAttribute("href", "#");
    dlRow.hidden = true;
  }

  function setStatus(text, isErr){
    status.textContent = text;
    status.className = isErr ? "ph-status err" : "ph-status";
  }

  function render(){
    grid.innerHTML = "";
    var total = 0;
    items.forEach(function(it, i){
      total += it.file.size;
      var box = document.createElement("div");
      box.className = "ph-item";
      var img = document.createElement("img");
      img.src = it.url; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      var no = document.createElement("span");
      no.className = "ph-no"; no.textContent = String(i + 1);
      var del = document.createElement("button");
      del.className = "ph-del"; del.textContent = "×";
      del.setAttribute("aria-label", (i + 1) + "枚目を外す");
      del.dataset.i = String(i);
      box.appendChild(img); box.appendChild(no); box.appendChild(del);
      grid.appendChild(box);
    });

    count.textContent = items.length + "枚";
    clearBtn.disabled = busy || !items.length;
    make.disabled = busy || !items.length;
    input.disabled = busy;
    make.textContent = built ? "ZIPを共有・保存" : "ZIPを作成";

    if (busy) return;
    if (built)            setStatus("完成: " + built.name + " · " + fmtSize(built.size));
    else if (items.length) setStatus(items.length + "枚 · 合計 " + fmtSize(total));
    else                  setStatus("写真を選んでください");
  }

  input.addEventListener("change", function(){
    var files = Array.prototype.slice.call(input.files || []);
    files.forEach(function(f){
      if (f.type && f.type.indexOf("image/") !== 0) return;
      items.push({ file: f, url: URL.createObjectURL(f) });
    });
    input.value = "";           // 同じ写真を続けて選び直せるように
    invalidate(); render();
  });

  grid.addEventListener("click", function(e){
    var b = e.target.closest(".ph-del");
    if (!b || busy) return;
    var i = Number(b.dataset.i);
    if (items[i]){ URL.revokeObjectURL(items[i].url); items.splice(i, 1); }
    invalidate(); render();
  });

  clearBtn.addEventListener("click", function(){
    if (busy) return;
    items.forEach(function(it){ URL.revokeObjectURL(it.url); });
    items = [];
    invalidate(); render();
  });

  function prepareDownload(file){
    if (dlUrl) URL.revokeObjectURL(dlUrl);
    dlUrl = URL.createObjectURL(file);
    dl.setAttribute("href", dlUrl);
    dl.setAttribute("download", file.name);
  }

  function shareOrDownload(file){
    var canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch(e){ canShare = false; }
    if (canShare){
      navigator.share({ files: [file] }).catch(function(err){
        if (!err || err.name !== "AbortError") dlRow.hidden = false;   // キャンセル以外の失敗はDLリンクを出す
      });
    } else {
      dlRow.hidden = false;
      dl.click();
    }
  }

  make.addEventListener("click", async function(){
    if (busy || !items.length) return;

    // 2回目のタップ: 作成済みZIPを共有(iOSはタップ直後でないと共有シートを開けないため2段階)
    if (built){ shareOrDownload(built); return; }

    busy = true; render();
    try {
      var entries = items.map(function(it, i){
        return { name: entryName(it.file, i, items.length), blob: it.file,
                 date: new Date(it.file.lastModified || Date.now()) };
      });
      var blob = await buildZip(entries, function(done, n){ setStatus("作成中… " + done + " / " + n); });
      var fileName = "交通費_" + monthTag() + ".zip";
      built = new File([blob], fileName, { type: "application/zip" });
      prepareDownload(built);
    } catch(err){
      built = null;
      busy = false; render();
      setStatus("ZIPを作成できませんでした: " + ((err && err.message) || err), true);
      return;
    }
    busy = false; render();
  });

  render();
})();
</script>
</body>
</html>
